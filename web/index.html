<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee4">
  <title>Northstar Bank | Banking, made clear</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Northstar Bank home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>northstar<span class="brand-light"> bank</span></span>
      </a>
      <span class="secure-label"><span class="secure-dot"></span> Local &amp; private</span>
    </header>
    <main id="app" class="main-content" aria-live="polite">
      <section class="loading-card">
        <span class="spinner" aria-hidden="true"></span>
        <p>Opening your secure banking space…</p>
      </section>
    </main>
    <footer class="footer">
      <span>Northstar Bank · Local demonstration</span>
      <span>Your information stays on this computer</span>
    </footer>
  </div>
</body>
</html>
